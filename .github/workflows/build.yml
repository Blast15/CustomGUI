name: build
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        java: [21, 25]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean test build
