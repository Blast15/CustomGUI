  economy-ambiguous: "<dark_red>Không xác định được trạng thái thanh toán. Hãy báo quản trị viên mã %transaction_id%.</dark_red>"
  provider-invalid-output: "<red>Nhà cung cấp vật phẩm trả về kết quả không hợp lệ.</red>"
  plugin-disabled: "<red>CustomGUI đang dừng và không nhận giao dịch mới.</red>"
